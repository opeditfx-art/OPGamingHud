
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP EDIT FX 3D Racing</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial;
background:#111;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:12px;
left:12px;
color:white;
font-size:18px;
font-weight:bold;
text-shadow:2px 2px 5px black;
line-height:1.6;
}

#controls{
position:absolute;
bottom:25px;
width:100%;
display:flex;
justify-content:space-around;
}

#controls button{
width:85px;
height:65px;
font-size:30px;
border:2px solid white;
border-radius:15px;
background:#111b;
color:white;
}

#start{
position:absolute;
inset:0;
background:#000d;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;
color:white;
z-index:5;
}

#start h1{
color:#ff3b00;
font-size:30px;
text-align:center;
}

#start button{
padding:15px 40px;
background:#ff3300;
border:0;
border-radius:12px;
color:white;
font-size:22px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="ui">
🏎️ OP EDIT FX<br>
SCORE: <span id="score">0</span><br>
SPEED: <span id="speed">0</span>
</div>

<div id="start">
<h1>OP EDIT FX<br>3D CAR RACING</h1>
<p>Ready For Racing?</p>
<button id="startBtn">START GAME</button>
</div>

<div id="controls">
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene,camera,renderer,car;

let enemies=[];
let roadLines=[];

let running=false;
let score=0;
let speed=0.25;
let lane=0;
let animationId;

function startGame(){

if(running)return;

if(renderer){
renderer.domElement.remove();
}

scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

scene.fog=new THREE.Fog(0x87ceeb,30,120);

camera=new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
0.1,
200
);

camera.position.set(0,6,10);
camera.lookAt(0,0,-5);

renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
0xffffff,0x444444,2
));

let sun=new THREE.DirectionalLight(
0xffffff,2
);

sun.position.set(5,10,5);

scene.add(sun);

// GRASS

let grass=new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({
color:0x238b35
})
);

grass.rotation.x=-Math.PI/2;
grass.position.y=-0.08;
grass.position.z=-40;

scene.add(grass);

// ROAD

let road=new THREE.Mesh(
new THREE.PlaneGeometry(12,200),
new THREE.MeshStandardMaterial({
color:0x303030
})
);

road.rotation.x=-Math.PI/2;
road.position.z=-40;

scene.add(road);

// ROAD LINES

roadLines=[];

for(let i=0;i<30;i++){

let line=new THREE.Mesh(
new THREE.BoxGeometry(.12,.03,2),
new THREE.MeshBasicMaterial({
color:0xffffff
})
);

line.position.set(0,.03,-i*5);

scene.add(line);

roadLines.push(line);

}

// PLAYER CAR

car=new THREE.Group();

let body=new THREE.Mesh(
new THREE.BoxGeometry(1.5,.6,2.6),
new THREE.MeshStandardMaterial({
color:0xff2200,
metalness:.4,
roughness:.3
})
);

body.position.y=.65;

car.add(body);

// CAR GLASS

let glass=new THREE.Mesh(
new THREE.BoxGeometry(1.1,.65,1.2),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

glass.position.set(0,1.2,-.15);

car.add(glass);

// WHEELS

for(let x of [-.8,.8]){

for(let z of [-.8,.8]){

let wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.35,.2,16),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

wheel.rotation.z=Math.PI/2;

wheel.position.set(x,.35,z);

car.add(wheel);

}

}

car.position.set(0,0,3);

scene.add(car);

// ENEMY CARS

enemies=[];

for(let i=0;i<6;i++){

let enemy=new THREE.Group();

let enemyBody=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1,2.5),
new THREE.MeshStandardMaterial({
color:[0x0000ff,0xffff00,0xffffff][i%3]
})
);

enemyBody.position.y=.6;

enemy.add(enemyBody);

enemy.position.set(
[-3,0,3][i%3],
0,
-20-i*17
);

scene.add(enemy);

enemies.push(enemy);

}

// RESET

score=0;
speed=0.25;
lane=0;

car.position.x=0;

running=true;

document.getElementById("score").innerText=0;

document.getElementById("start").style.display="none";

animate();

}

// MOVEMENT

function move(dir){

if(!running)return;

lane=Math.max(-1,Math.min(1,lane+dir));

}

// BUTTONS

document.getElementById("left").addEventListener(
"click",()=>move(-1)
);

document.getElementById("right").addEventListener(
"click",()=>move(1)
);

// KEYBOARD

document.addEventListener("keydown",function(e){

if(e.key==="ArrowLeft"||e.key==="a"){
move(-1);
}

if(e.key==="ArrowRight"||e.key==="d"){
move(1);
}

});

// GAME LOOP

function animate(){

if(!running)return;

animationId=requestAnimationFrame(animate);

// SCORE

score++;

// SPEED INCREASE WITH SCORE

speed=0.25+(score/1000)*0.5;

speed=Math.min(speed,2.5);

// UPDATE UI

document.getElementById("score").innerText=score;

document.getElementById("speed").innerText=
(speed*100).toFixed(0);

// SMOOTH CAR MOVEMENT

car.position.x+=(lane*3-car.position.x)*0.15;

// ROAD MOVEMENT

roadLines.forEach(line=>{

line.position.z+=speed*1.5;

if(line.position.z>8){

line.position.z-=150;

}

});

// ENEMY MOVEMENT

enemies.forEach(enemy=>{

enemy.position.z+=speed;

// RESPAWN

if(enemy.position.z>8){

enemy.position.z=-90-Math.random()*40;

enemy.position.x=[-3,0,3][
Math.floor(Math.random()*3)
];

}

// COLLISION

if(
Math.abs(enemy.position.z-car.position.z)<2.2 &&
Math.abs(enemy.position.x-car.position.x)<1.4
){

gameOver();

}

});

// CAMERA

camera.position.x+=(car.position.x*.25-camera.position.x)*.05;

camera.lookAt(car.position.x*.2,0,-5);

renderer.render(scene,camera);

}

// GAME OVER

function gameOver(){

running=false;

cancelAnimationFrame(animationId);

document.getElementById("start").style.display="flex";

document.querySelector("#start h1").innerHTML=
"💥 GAME OVER";

document.querySelector("#start p").innerText=
"YOUR SCORE: "+score;

document.getElementById("startBtn").innerText=
"PLAY AGAIN";

}

// RESIZE

window.addEventListener("resize",()=>{

if(!camera||!renderer)return;

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

document.getElementById("startBtn").addEventListener(
"click",startGame
);

</script>

</body>
</html>
<button onclick="openGame2()">🎮 दूसरा गेम खेलें</button>

<script>
function openGame2() {
    window.location.href = "game2.html";
}
</script>
